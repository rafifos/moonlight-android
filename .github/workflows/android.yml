name: Android CI

on:
  push:
    branches: [ "moonlight-noir" ]
    paths-ignore:
      - '**.md'
      - '**.json'
  pull_request:
    branches: [ "moonlight-noir" ]
    paths-ignore:
      - '**.md'
      - '**.json'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: setup NDK
      uses: nttld/setup-ndk@v1
      with:
       ndk-version: r27
       local-cache: true
       link-to-sdk: true

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload NonRoot Artifact
      uses: actions/upload-artifact@v3
      with:
        name: "auto_built_snapshot_nonRoot_${{ github.sha }}.apk"
        path: app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
        retention-days: 10

    - name: Upload Root Artifact
      uses: actions/upload-artifact@v3
      with:
        name: "auto_built_snapshot_root_${{ github.sha }}.apk"
        path: app/build/outputs/apk/root/debug/app-root-debug.apk
        retention-days: 10
